services:
  # Backend API service
  - type: web
    name: healthcare-rfp-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: sqlite:///./rfp_analyzer.db
      - key: VECTOR_DB_PATH
        value: ./data/chromadb
      - key: UPLOAD_DIR
        value: ./uploads

  # Frontend static web app
  - type: web
    name: healthcare-rfp-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: healthcare-rfp-backend
          property: host
